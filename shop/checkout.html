<!DOCTYPE html>
<html lang="en">

<head>
  <title>Checkout | Silver Tech</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/services.css">
<link rel="stylesheet" href="../css/about.css">
<link rel="stylesheet" href="../css/contact.css">
<link rel="stylesheet" href="../css/shop.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <header class="site-header">
    <img src="../images/logo.png" alt="Silver Tech Logo" class="logo">

    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../services.html">Services</a>
      <a href="../about.html">About</a>
      <a href="products.html">Shop</a>
      <a href="../contact.html">Contact</a>
    </nav>

    <a href="cart.html" class="basket-btn">Basket</a>
  </header>

  <section class="page-intro">
    <h1>Checkout</h1>
    <p>Secure and simple.</p>
  </section>

  <section class="checkout-section">

    <form class="checkout-form" onsubmit="return placeOrder()">

      <div class="checkout-column">
        <h3>Customer Information</h3>

        <input type="text" id="checkout-name" placeholder="Full Name">

        <input type="email" id="checkout-email" placeholder="Email">

        <input type="text" id="checkout-phone" placeholder="Phone Number">

        <input type="text" id="checkout-address" placeholder="Address">

        <input type="text" id="checkout-eircode" placeholder="Eircode">
      </div>

      <div class="checkout-column">
        <h3>Payment Information</h3>

        <input type="text" id="checkout-card" placeholder="Card Number">

        <input type="text" id="checkout-expiry" placeholder="Expiry Date MM / YY">

        <input type="text" id="checkout-cvv" placeholder="CVV">

        <button type="submit">Place Order</button>

        <p id="orderMessage"></p>
      </div>

    </form>

  </section>

  <footer>
    <p>&copy; 2026 Silver Tech</p>
  </footer>

  <script src="checkout.js"></script>

</body>
</html>
