<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact - Silver Tech</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Logo -->
<div style="text-align: center; margin-top: 20px;">
  <img src="images/logo.png" alt="DeepClean Logo" width="150">
</div>

<!--  menu bar -->
<div class="blue-bar">
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<!-- Contact section -->
<section class="container mt-5">

  <h1 class="text-center mb-4">Book a friendly home visit today.</h1>

  <div class="row justify-content-center">

    <div class="col-md-6">

      <!-- FORM  -->
      <form class="p-4 bg-white shadow-sm rounded" onsubmit="return validateForm()">

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" id="name">
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email">
        </div>

        <!-- Message -->
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="message"></textarea>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-custom w-100">
          Send Message
        </button>

      </form>

    </div>

  </div>

</section>

<!-- Footer -->
<footer style="text-align: center; margin-top: 50px;">
  <p>&copy; 2026 Silver Tech </p>
</footer>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
