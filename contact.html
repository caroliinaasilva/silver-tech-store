<!DOCTYPE html>
<html lang="en">

<head>
  <title>Contact | Silver Tech</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <header class="site-header">
    <img src="images/logo.png" alt="Silver Tech Logo" class="logo">

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="shop/products.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>

    <a href="shop/cart.html" class="basket-btn">Basket</a>
  </header>

  <section class="contact-section">
    <div class="contact-info">
      <h1>Contact Us</h1>
      <h3>We'd love to hear from you.</h3>
      <p>Have a question or would like to book a visit? Fill in the form below or contact us directly.</p>

      <div class="contact-item">
        <i class="bi bi-telephone-fill"></i>
        <span>089 123 4567</span>
      </div>

      <div class="contact-item">
        <i class="bi bi-envelope-fill"></i>
        <span>info@silvertech.ie</span>
      </div>

      <div class="contact-item">
        <i class="bi bi-geo-alt-fill"></i>
        <span>Dublin, Ireland</span>
      </div>
    </div>

    <form class="contact-form" onsubmit="return validateForm()">
      <input type="text" id="name" placeholder="Your Name">
      <input type="text" id="phone" placeholder="Your Phone">
      <input type="email" id="email" placeholder="Your Email">
      <textarea id="message" rows="7" placeholder="Your Message"></textarea>
      <button type="submit">Send Message</button>
      <p id="successMessage"></p>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Silver Tech</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
